<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C to Rust Playground</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
    />
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        margin-top: 1rem;
      }

      .editor-container {
        display: flex;
        width: 100%;
        height: 90vh;
        margin-top: 1rem;
      }

      .editor {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 1rem;
        box-sizing: border-box;
      }

      .code-wrapper {
        flex: 1;
        position: relative;
        font-family: monospace;
        font-size: 1rem;
        line-height: 1.5;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fdfaf6;
        overflow: auto;
      }

      textarea,
      pre code {
        font-family: monospace;
        font-size: 1rem;
        line-height: 1.5;
        padding: 1rem;
        border: none;
        background: transparent;
        width: 100%;
        height: 100%;
        overflow: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        box-sizing: border-box;
      }

      textarea {
        position: absolute;
        top: 0;
        left: 0;
        color: transparent;
        caret-color: black;
        z-index: 2;
        resize: none;
        outline: none;
      }

      pre {
        margin: 0;
        height: 100%;
        overflow: auto;
      }

      pre code {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        pointer-events: none;
        color: inherit;
      }

      .buttons {
        margin: 1rem;
      }
      #rustOutput {
        display: block;
        white-space: pre;
        overflow: auto;
        pointer-events: auto; /* ✅ Allow interaction */
      }
    </style>
  </head>
  <body>
    <h1>C to Rust Playground</h1>
    <div class="editor-container">
      <div class="editor">
        <h2>C Code</h2>
        <div class="code-wrapper">
          <textarea
            id="cCode"
            oninput="updateCHighlight()"
            spellcheck="false"
          ></textarea>
          <pre><code id="cHighlight" class="language-c"></code></pre>
        </div>
      </div>
      <div class="editor">
        <h2>Rust Output</h2>
        <pre
          class="code-wrapper"
        ><code id="rustOutput" class="language-rust">// Converted Rust code will appear here...</code></pre>
      </div>
    </div>
    <div class="buttons">
      <button id="my_button">Compile</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-rust.min.js"></script>

    <script type="module" src="DriverWasm.bc.wasm.js"></script>
    <script>
      const cCodeTextarea = document.getElementById("cCode");
      const cHighlight = document.getElementById("cHighlight");
      const rustOutput = document.getElementById("rustOutput");

      cCodeTextarea.value = `
int switch_ex(int e){
    int a = 9;
    switch (e) {
        case 1: a++;
        case 5: a--;
        default: a += 2;
        case 3: a -= 2;
        case 4: a = 10;
    }
    return a;
}`;
      updateCHighlight();

      function updateCHighlight() {
        cHighlight.textContent = cCodeTextarea.value;
        Prism.highlightElement(cHighlight);
      }

      cCodeTextarea.addEventListener("scroll", () => {
        cHighlight.parentElement.scrollTop = cCodeTextarea.scrollTop;
        cHighlight.parentElement.scrollLeft = cCodeTextarea.scrollLeft;
      });

      const rustOutput2 = document.getElementById("rustOutput");

      document.getElementById("my_button").addEventListener("click", () => {
        setTimeout(() => {
          Prism.highlightElement(rustOutput2);
        }, 0); // ✅ Runs after WASM finishes updating DOM
      });
    </script>
  </body>
</html>
